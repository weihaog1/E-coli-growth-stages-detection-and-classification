# ============================================
# E. coli Growth Stage Detection - Config
# ============================================

# Paths
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  augmented_data: "data/augmented"
  weights: "weights"
  logs: "logs"

# Dataset
dataset:
  img_size: 256
  num_classes: 3
  classes:
    0: "rod"
    1: "dividing"
    2: "microcolony"
  split:
    train: 0.7
    val: 0.2
    test: 0.1

# Augmentation
augmentation:
  enabled: true
  target_samples: 1000  # Target augmented dataset size
  geometric:
    rotation: 45
    horizontal_flip: true
    vertical_flip: true
  pixel:
    brightness_limit: 0.2
    contrast_limit: 0.2
    blur_limit: 3
    noise: true

# Training - Custom CNN
cnn:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  patch_size: 64  # For sliding window
  stride: 32
  nms_threshold: 0.5

# Training - YOLOv8
yolo:
  model: "yolov8n.pt"  # nano model, can use yolov8s/m/l/x
  batch_size: 16
  epochs: 100
  imgsz: 256
  pretrained: true
  freeze_layers: 10  # Freeze backbone layers for transfer learning

# Reproducibility
seed: 42

